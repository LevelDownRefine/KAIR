[project]
name = "kair"
version = "0.1.0"
description = "KAIR - PyTorch image restoration (BasicSR-based), configured for NVIDIA RTX 5070 Ti (Blackwell / sm_120)"
requires-python = ">=3.10"
dependencies = [
    # Official stable CUDA 13.0 wheels, including Blackwell (sm_120) support.
    # The NVIDIA driver must support CUDA 13.0; see docs/README_CUDA13.md.
    "torch==2.14.0",
    "torchvision==0.29.0",

    # --- rest from PyPI ---
    "opencv-python",
    "scikit-image",
    "pillow",
    "hdf5storage",
    "ninja",
    "lmdb",
    "requests",
    "timm",
    "einops",
    # --- added during review: actually imported by the codebase ---
    "numpy",        # used by ~60 files; only present transitively otherwise
    "scipy",        # used by DnCNN/IRCNN/SRMD/USRNet/DRUNet paths (10 files)
    "matplotlib",   # imported at top of utils/utils_image.py -> needed by almost every main_*
    "scikit-learn>=1.5,<2",  # MARBLE cosine kNN position decoder, NumPy 2 compatible
]

[dependency-groups]
# Dev-only tools (not part of the runtime environment).
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

# PyTorch publishes CUDA-enabled wheels on its own index.
# Mark it explicit so uv only uses it for the packages listed in [tool.uv.sources],
# leaving everything else on PyPI.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
